<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Taxi Trace</title>
  <!-- iPad "Add to Home Screen": fullscreen, no Safari chrome -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taxi Trace">
  <meta name="theme-color" content="#131922">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230d1117'/><path d='M3 13V8h6V3' stroke='%23ffd60a' stroke-width='2.5' fill='none'/></svg>">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="bar">
    <div class="bar-row">
      <div class="brand">TAXI<span>TRACE</span></div>

      <form id="airport-form" class="airport-form" autocomplete="off">
        <input id="icao" list="airport-list" placeholder="ICAO" maxlength="8" spellcheck="false" autocorrect="off" autocapitalize="characters" enterkeyhint="go" aria-label="Airport ICAO">
        <datalist id="airport-list"></datalist>
        <button type="submit" class="search-btn" aria-label="Search airport"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5 L21 21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg><span>Search</span></button>
      </form>

      <div class="seg" id="source-seg" role="radiogroup" aria-label="Taxiway source">
        <button type="button" data-source="osm" role="radio">OpenStreetMap</button>
        <button type="button" data-source="trace" role="radio">My chart</button>
      </div>

      <div class="spacer"></div>
      <label class="check" title="Zoom the map to the route as you type"><input type="checkbox" id="autofit"> Auto-zoom</label>
      <button type="button" id="fit-btn" title="Zoom to route">Fit</button>
      <button type="button" id="edit-btn" hidden>Edit traces</button>
      <button type="button" id="panel-btn" title="Airport details">Info</button>
      <button type="button" id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>

    <div class="clearance-wrap">
      <input id="clearance" class="clearance" placeholder="Type the taxi clearance — A J K" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="characters" enterkeyhint="done" aria-label="Taxi clearance" disabled>
      <kbd class="esc-hint">Esc clears</kbd>
      <button type="button" id="clear-clearance" class="clearance-clear" aria-label="Clear clearance" hidden>✕</button>
    </div>

    <div class="strip-row">
      <div id="route-strip" class="route-strip" aria-live="polite"></div>
      <div class="route-tools" role="group" aria-label="Route start and end">
        <span class="tool"><button type="button" id="pick-start" class="pick start" title="Click, then click your gate on the map">Set start</button><button type="button" id="clear-start" class="clear" title="Remove start" hidden>✕</button></span>
        <span class="tool"><button type="button" id="pick-end" class="pick end" title="Click, then click where you're taxiing to">Set end</button><button type="button" id="clear-end" class="clear" title="Remove end" hidden>✕</button></span>
      </div>
    </div>
  </header>

  <main class="main">
    <aside id="tray" class="tray" aria-label="Taxiway keypad"></aside>
    <div id="map" class="map"></div>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <div id="overlay-msg"></div>
        <div id="overlay-actions" class="overlay-actions"></div>
      </div>
    </div>

    <aside id="info-panel" class="panel" hidden></aside>
    <aside id="settings-panel" class="panel" hidden></aside>
    <aside id="trace-panel" class="panel" hidden></aside>
  </main>

  <input type="file" id="chart-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
